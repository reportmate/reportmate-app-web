name: CI

# Build validation for pushes and PRs to main.
#
# next.config.mjs sets typescript.ignoreBuildErrors and eslint.ignoreDuringBuilds
# to true, so `next build` catches NEITHER type nor lint errors. The backlog that
# made those checks report-only is cleared, so they are hard gates here: tsc,
# eslint (warnings included, via --max-warnings=0) and the unit tests all block,
# alongside the production build that ships in the Docker image.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
